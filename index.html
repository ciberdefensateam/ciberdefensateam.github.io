<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiberDefensa Team</title>
    <style>
        :root {
            --bg: #0a0e14;
            --terminal-bg: #0d1117;
            --border: #222a35;
            --text: #b7c0cc;
            --dim: #5b6472;
            --accent: #5fb87a;
            --accent-2: #7aa2c9;
            --warn: #c9a227;
            --dot-red: #c9575a;
            --dot-yellow: #c9a227;
            --dot-green: #3ea55c;
            --taskbar-height: 52px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at 50% 0%, #131a24 0%, var(--bg) 60%);
            color: var(--text);
            font-family: "Cascadia Code", "Fira Code", ui-monospace, "SFMono-Regular", Consolas, "Courier New", monospace;
        }

        body.custom-cursor {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'><path d='M3 1 L3 18 L7.5 14.2 L10.5 20.5 L13.3 19.1 L10.3 13 L17 13 Z' fill='black' stroke='%23e2e8f0' stroke-width='1.2' stroke-linejoin='round'/></svg>") 3 1, auto;
        }

        .hidden-input {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            border: 0;
            padding: 0;
            background: transparent;
        }

        @keyframes blink {
            0%, 49% { opacity: 0.85; }
            50%, 100% { opacity: 0.15; }
        }

        .terminal {
            position: fixed;
            display: flex;
            flex-direction: column;
            background: var(--terminal-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transform-origin: 30px 24px;
        }

        .terminal.closing {
            animation: windowClose 0.32s ease-in forwards;
        }

        .terminal.minimizing,
        .terminal.restoring {
            transform-origin: center bottom;
        }

        .terminal.minimizing {
            animation: windowMinimize 0.28s ease-in forwards;
        }

        .terminal.restoring {
            animation: windowRestore 0.28s ease-out forwards;
        }

        @keyframes windowClose {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.04); }
        }

        @keyframes windowMinimize {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.15) translateY(55vh); }
        }

        @keyframes windowRestore {
            from { opacity: 0; transform: scale(0.15) translateY(55vh); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .terminal.opening {
            animation: windowOpen 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes windowOpen {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .window-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 12, 0.65);
            backdrop-filter: blur(2px);
        }

        .window-backdrop.opening {
            animation: backdropIn 0.25s ease-out;
        }

        .window-backdrop.closing {
            animation: backdropOut 0.2s ease-in forwards;
        }

        @keyframes backdropIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes backdropOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 0.9rem;
            background: #10151c;
            border-bottom: 1px solid var(--border);
            user-select: none;
            touch-action: none;
            cursor: grab;
            flex: 0 0 auto;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        .dot.red { background: var(--dot-red); }
        .dot.yellow { background: var(--dot-yellow); }
        .dot.green { background: var(--dot-green); }

        .terminal-title {
            flex: 1;
            text-align: center;
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 0.02em;
        }

        .terminal-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 1.4rem 1.4rem 1.6rem;
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt {
            color: var(--accent-2);
        }

        .prompt .path {
            color: var(--accent);
        }

        .cmd {
            color: var(--text);
        }

        .output {
            color: var(--dim);
            margin: 0.1rem 0 0.7rem 0;
            white-space: pre-wrap;
        }

        .output .highlight {
            color: var(--warn);
        }

        .output a {
            color: var(--accent-2);
            text-decoration: underline;
            text-decoration-color: rgba(122, 162, 201, 0.4);
            text-underline-offset: 2px;
        }

        .output a:hover {
            color: var(--accent);
            text-decoration-color: var(--accent);
        }

        .caret {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: var(--accent);
            vertical-align: text-bottom;
            margin-left: 2px;
            animation: blink 1s steps(1) infinite;
        }

        .resize-handle {
            position: absolute;
            right: 2px;
            bottom: 2px;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
            background:
                linear-gradient(135deg,
                    transparent 0 40%, var(--dim) 40% 46%,
                    transparent 46% 60%, var(--dim) 60% 66%,
                    transparent 66% 80%, var(--dim) 80% 86%,
                    transparent 86%);
        }

        .taskbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--taskbar-height);
            background: #10151c;
            border-top: 1px solid var(--border);
            display: none;
            align-items: center;
            gap: 0.6rem;
            padding: 0 0.8rem;
            z-index: 1000;
        }

        .dock {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow-x: auto;
            height: 100%;
        }

        .dock-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: inherit;
            font-size: 0.78rem;
            color: var(--text);
            background: #131a24;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.35rem 0.7rem;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .dock-item:hover {
            border-color: var(--accent-2);
        }

        .dock-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }

        @media (max-width: 640px) {
            .terminal-body {
                font-size: 0.82rem;
                padding: 1.1rem;
            }
        }

        .ig-body {
            padding: 1.4rem 1.4rem 1.6rem;
            font-size: 0.92rem;
            line-height: 1.6;
            text-align: center;
        }

        .ig-body p {
            margin: 0 0 0.7rem;
            color: var(--text);
        }

        .ig-body p.ig-title {
            color: var(--accent);
            font-weight: bold;
        }

        .ig-links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.6rem;
        }

        .ig-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            font-size: 0.95rem;
            text-decoration: none;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            width: min(320px, 80%);
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        }

        .ig-btn.primary {
            background: linear-gradient(180deg, rgba(95,184,122,0.12), rgba(95,184,122,0.04));
            border-color: rgba(95,184,122,0.25);
            color: #eaf9ef;
            font-weight: 600;
        }

        .ig-btn.secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--accent-2);
        }

        .ig-close-btn {
            display: block;
            margin: 0 auto;
            font-family: inherit;
            font-size: 0.78rem;
            color: var(--text);
            background: #131a24;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.45rem 1rem;
            cursor: pointer;
        }

        .ig-close-btn:hover {
            border-color: var(--accent-2);
            color: var(--accent-2);
        }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="dock" id="dock"></div>
    </div>

    <script>
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            const blockedCombo =
                key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(key)) ||
                (e.ctrlKey && ['U', 'u', 'S', 's'].includes(key));

            if (blockedCombo) {
                e.preventDefault();
            }
        });

        const TASKBAR_HEIGHT = 52;
        const MIN_W = 320;
        const MIN_H = 240;
        const DEFAULT_W = 700;
        const DEFAULT_H = 440;

        const PROMPT_HTML = '<span class="prompt">guest@<span class="path">ciberdefensa</span>:~$</span> ';

        const HELP_TEXT = 'Comandos: cat about.md, cat instagram.md, cat banner.txt, start, clear, help';

        const BANNER_WIDTH = 50;

        function centerText(text, width) {
            const pad = Math.max(width - text.length, 0);
            const left = Math.floor(pad / 2);
            return ' '.repeat(left) + text + ' '.repeat(pad - left);
        }

        function bannerBorder(width) {
            return '+' + '-'.repeat(width + 2) + '+';
        }

        function bannerLine(text, width) {
            return '| ' + centerText(text, width) + ' |';
        }

        const BANNER_LINES = [
            bannerBorder(BANNER_WIDTH),
            bannerLine('C I B E R D E F E N S A   T E A M', BANNER_WIDTH),
            bannerBorder(BANNER_WIDTH),
            '',
            'Grupo de estudiantes de la FADENA 🛡️',
            'Noticias, memes e info de ciberseguridad, todo en un solo lugar.',
            '',
            '<a href="https://instagram.com/ciberdefensa.team" target="_blank" rel="noopener">instagram.com/ciberdefensa.team</a>',
            '',
            HELP_TEXT
        ];

        const commands = [
            {
                cmd: 'cat about.md',
                output: [
                    'Grupo de estudiantes de la FADENA 🛡️',
                    'Noticias, memes e info de ciberseguridad, todo en un solo lugar.'
                ]
            },
            {
                cmd: 'cat instagram.md',
                output: ['<a href="https://instagram.com/ciberdefensa.team" target="_blank" rel="noopener">instagram.com/ciberdefensa.team</a>']
            },
            {
                cmd: 'cat banner.txt',
                output: BANNER_LINES
            },
            {
                cmd: 'help',
                output: [HELP_TEXT]
            }
        ];

        const introSteps = [commands.find((c) => c.cmd === 'cat banner.txt')];

        const dockEl = document.getElementById('dock');
        const taskbarEl = document.querySelector('.taskbar');

        function updateTaskbarVisibility() {
            taskbarEl.style.display = dockEl.children.length > 0 ? 'flex' : 'none';
        }

        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'text';
        hiddenInput.className = 'hidden-input';
        hiddenInput.autocomplete = 'off';
        hiddenInput.spellcheck = false;
        hiddenInput.setAttribute('aria-label', 'terminal input');
        document.body.appendChild(hiddenInput);

        let activeWindow = null;
        const terminalControllers = [];

        hiddenInput.addEventListener('input', () => {
            if (activeWindow) activeWindow.handleInput(hiddenInput.value);
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && activeWindow) {
                e.preventDefault();
                activeWindow.handleEnter(hiddenInput.value);
                hiddenInput.value = '';
            }
        });

        function clamp(v, min, max) {
            return Math.min(Math.max(v, min), max);
        }

        function clampWindowToViewport(el) {
            const maxW = window.innerWidth;
            const maxH = window.innerHeight - TASKBAR_HEIGHT;
            const width = clamp(el.offsetWidth, Math.min(MIN_W, maxW), maxW);
            const height = clamp(el.offsetHeight, Math.min(MIN_H, maxH), maxH);
            el.style.width = width + 'px';
            el.style.height = height + 'px';
            const maxLeft = Math.max(maxW - width, 0);
            const maxTop = Math.max(maxH - height, 0);
            el.style.left = clamp(parseFloat(el.style.left) || 0, 0, maxLeft) + 'px';
            el.style.top = clamp(parseFloat(el.style.top) || 0, 0, maxTop) + 'px';
        }

        window.addEventListener('resize', () => {
            document.querySelectorAll('.terminal').forEach((el) => {
                if (el.style.display === 'none') return; // minimized: leave its stored bounds alone
                clampWindowToViewport(el);
            });
        });

        const MODAL_Z = 4000;
        let openModal = null;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && openModal) openModal.close();
        });

        /**
         * WindowManager: the single source of truth for every open window,
         * independent of its type (terminal, instagram, ...). It owns identity
         * (id + type), stacking order, and which window currently has focus.
         * Visual animations are cosmetic; the state below is what "close",
         * "minimize" and "maximize" actually mean.
         */
        const WindowManager = {
            registry: new Map(),
            zIndexCounter: 10,
            activeId: null,
            nextId: 1,

            register(win) {
                this.registry.set(win.id, win);
            },
            unregister(id) {
                this.registry.delete(id);
                if (this.activeId === id) this.activeId = null;
            },
            bringToFront(win) {
                win.el.style.zIndex = ++this.zIndexCounter;
            },
            setActive(win) {
                this.activeId = win ? win.id : null;
            },
            countByType(type) {
                let n = 0;
                this.registry.forEach((w) => { if (w.type === type) n++; });
                return n;
            }
        };

        /**
         * Builds one OS-style window (chrome, drag, resize, minimize/maximize/close
         * state machine, taskbar integration) and hands the body element to
         * config.buildBody so callers only need to supply content per window type.
         *
         * config: { type, title, dockLabel, width, height, resizable, cascade,
         *           extraBodyClass, buildBody(bodyEl, api), onFocus(api), onClose(api) }
         */
        function createManagedWindow(config) {
            const id = WindowManager.nextId++;

            const el = document.createElement('div');
            el.className = 'terminal';
            el.dataset.winType = config.type;
            el.dataset.winId = String(id);
            el.innerHTML =
                '<div class="terminal-header">' +
                    '<span class="dot red"></span>' +
                    '<span class="dot yellow"></span>' +
                    '<span class="dot green"></span>' +
                    '<span class="terminal-title"></span>' +
                '</div>' +
                '<div class="terminal-body"></div>' +
                (config.resizable ? '<div class="resize-handle"></div>' : '');
            el.querySelector('.terminal-title').textContent = config.title;
            document.body.appendChild(el);

            const bodyEl = el.querySelector('.terminal-body');
            const headerEl = el.querySelector('.terminal-header');
            const redDot = el.querySelector('.dot.red');
            const yellowDot = el.querySelector('.dot.yellow');
            const greenDot = el.querySelector('.dot.green');
            const resizeHandle = el.querySelector('.resize-handle');

            if (config.extraBodyClass) bodyEl.classList.add(config.extraBodyClass);
            if (typeof config.width === 'number') el.style.width = config.width + 'px';
            if (typeof config.height === 'number') el.style.height = config.height + 'px';

            // normal | maximized | minimized | closed — the real state; CSS classes below only animate the transition
            let state = 'normal';
            let animating = false;
            let restoreBounds = null;
            let dockItem = null;

            let backdropEl = null;
            if (config.modal) {
                backdropEl = document.createElement('div');
                backdropEl.className = 'window-backdrop';
                document.body.appendChild(backdropEl);
                backdropEl.addEventListener('click', () => closeWindow());
                backdropEl.addEventListener('animationend', (e) => {
                    if (e.animationName === 'backdropOut') backdropEl.remove();
                });
            }

            function bringToFront() {
                if (config.modal) {
                    // a modal window always owns the top of the stack while it's open,
                    // with its backdrop pinned directly beneath it
                    el.style.zIndex = String(MODAL_Z + 1);
                    if (backdropEl) backdropEl.style.zIndex = String(MODAL_Z);
                } else {
                    WindowManager.bringToFront(api);
                }
            }

            function focusThisWindow() {
                WindowManager.setActive(api);
                bringToFront();
                if (config.onFocus) config.onFocus(api);
            }

            el.addEventListener('pointerdown', bringToFront);
            bodyEl.addEventListener('click', focusThisWindow);

            function maximizeWindow() {
                if (animating || state === 'minimized' || state === 'closed' || state === 'maximized') return;
                restoreBounds = {
                    left: el.style.left,
                    top: el.style.top,
                    width: el.style.width,
                    height: el.style.height
                };
                el.style.left = '0px';
                el.style.top = '0px';
                el.style.width = window.innerWidth + 'px';
                el.style.height = (window.innerHeight - TASKBAR_HEIGHT) + 'px';
                state = 'maximized';
                bringToFront();
            }

            function unmaximizeWindow() {
                if (state !== 'maximized') return;
                if (restoreBounds) {
                    el.style.left = restoreBounds.left;
                    el.style.top = restoreBounds.top;
                    el.style.width = restoreBounds.width;
                    el.style.height = restoreBounds.height;
                }
                state = 'normal';
                bringToFront();
            }

            greenDot.addEventListener('click', () => {
                if (animating || state === 'minimized' || state === 'closed') return;
                if (state === 'maximized') unmaximizeWindow(); else maximizeWindow();
            });

            headerEl.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.dot') || animating || state === 'maximized' || state === 'minimized') return;
                bringToFront();

                const rect = el.getBoundingClientRect();
                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = rect.left;
                const startTop = rect.top;

                headerEl.setPointerCapture(e.pointerId);
                headerEl.style.cursor = 'grabbing';

                function onMove(ev) {
                    const maxLeftNow = Math.max(window.innerWidth - el.offsetWidth, 0);
                    const maxTopNow = Math.max(window.innerHeight - TASKBAR_HEIGHT - el.offsetHeight, 0);
                    const newLeft = clamp(startLeft + (ev.clientX - startX), 0, maxLeftNow);
                    const newTop = clamp(startTop + (ev.clientY - startY), 0, maxTopNow);
                    el.style.left = newLeft + 'px';
                    el.style.top = newTop + 'px';
                }

                function onUp() {
                    headerEl.releasePointerCapture(e.pointerId);
                    headerEl.style.cursor = 'grab';
                    headerEl.removeEventListener('pointermove', onMove);
                    headerEl.removeEventListener('pointerup', onUp);
                }

                headerEl.addEventListener('pointermove', onMove);
                headerEl.addEventListener('pointerup', onUp);
            });

            if (resizeHandle) {
                resizeHandle.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    if (animating || state === 'maximized' || state === 'minimized') return;
                    bringToFront();

                    const rect = el.getBoundingClientRect();
                    const startX = e.clientX;
                    const startY = e.clientY;
                    const startW = rect.width;
                    const startH = rect.height;

                    resizeHandle.setPointerCapture(e.pointerId);

                    function onMove(ev) {
                        const maxW = window.innerWidth - rect.left;
                        const maxH = (window.innerHeight - TASKBAR_HEIGHT) - rect.top;
                        const newW = clamp(startW + (ev.clientX - startX), MIN_W, maxW);
                        const newH = clamp(startH + (ev.clientY - startY), MIN_H, maxH);
                        el.style.width = newW + 'px';
                        el.style.height = newH + 'px';
                    }

                    function onUp() {
                        resizeHandle.releasePointerCapture(e.pointerId);
                        resizeHandle.removeEventListener('pointermove', onMove);
                        resizeHandle.removeEventListener('pointerup', onUp);
                    }

                    resizeHandle.addEventListener('pointermove', onMove);
                    resizeHandle.addEventListener('pointerup', onUp);
                });
            }

            function addDockItem() {
                dockItem = document.createElement('button');
                dockItem.className = 'dock-item';
                dockItem.innerHTML = '<span class="dock-dot"></span>' + (config.dockLabel || config.title);
                dockItem.addEventListener('click', restoreWindow);
                dockEl.appendChild(dockItem);
                updateTaskbarVisibility();
            }

            function removeDockItem() {
                if (dockItem) {
                    dockItem.remove();
                    dockItem = null;
                    updateTaskbarVisibility();
                }
            }

            function minimizeWindow() {
                if (animating || state === 'minimized' || state === 'closed') return;
                animating = true;
                state = 'minimized';
                if (WindowManager.activeId === id) WindowManager.setActive(null);
                el.classList.add('minimizing');
                if (backdropEl) backdropEl.style.display = 'none';
            }

            function restoreWindow() {
                if (state !== 'minimized') return;
                removeDockItem();
                el.style.display = '';
                animating = true;
                state = 'normal';
                el.classList.add('restoring');
                if (backdropEl) backdropEl.style.display = '';
                focusThisWindow();
            }

            function closeWindow() {
                if (animating || state === 'closed') return;
                animating = true;
                state = 'closed';
                el.classList.add('closing');
                if (backdropEl) backdropEl.classList.add('closing');
                if (openModal === api) openModal = null;
            }

            redDot.addEventListener('click', closeWindow);
            yellowDot.addEventListener('click', minimizeWindow);

            el.addEventListener('animationend', (e) => {
                if (e.animationName === 'windowClose') {
                    WindowManager.unregister(id);
                    el.remove();
                    if (config.onClose) config.onClose(api);
                } else if (e.animationName === 'windowMinimize') {
                    el.classList.remove('minimizing');
                    el.style.display = 'none';
                    animating = false;
                    addDockItem();
                } else if (e.animationName === 'windowRestore') {
                    el.classList.remove('restoring');
                    animating = false;
                } else if (e.animationName === 'windowOpen') {
                    el.classList.remove('opening');
                }
            });

            const api = {
                id,
                type: config.type,
                el,
                bodyEl,
                bringToFront,
                focus: focusThisWindow,
                close: closeWindow,
                minimize: minimizeWindow,
                restore: restoreWindow,
                maximize: maximizeWindow,
                unmaximize: unmaximizeWindow,
                getState: () => state
            };

            WindowManager.register(api);

            if (config.buildBody) config.buildBody(bodyEl, api);

            // Position last: for auto-height windows this must run after buildBody
            // populates content, otherwise offsetHeight would still read the empty shell.
            const sameTypeCount = config.cascade ? WindowManager.countByType(config.type) - 1 : 0;
            const cascadeOffset = (sameTypeCount % 6) * 26;
            const w = el.offsetWidth;
            const h = el.offsetHeight;
            const maxLeft = Math.max(window.innerWidth - w, 0);
            const maxTop = Math.max(window.innerHeight - TASKBAR_HEIGHT - h, 0);
            const baseLeft = (window.innerWidth - w) / 2;
            const baseTop = (window.innerHeight - TASKBAR_HEIGHT - h) / 2;
            el.style.left = clamp(baseLeft + cascadeOffset, 0, maxLeft) + 'px';
            el.style.top = clamp(baseTop + cascadeOffset, 0, maxTop) + 'px';
            bringToFront();

            el.classList.add('opening');
            if (backdropEl) backdropEl.classList.add('opening');
            if (config.modal) openModal = api;

            return api;
        }

        let terminalWindowCount = 0;

        function createTerminalWindow() {
            terminalWindowCount++;
            const instanceLabel = terminalWindowCount > 1
                ? 'guest@ciberdefensa: ~ (' + terminalWindowCount + ')'
                : 'guest@ciberdefensa: ~';

            const width = Math.min(DEFAULT_W, window.innerWidth - 32);
            const height = Math.min(DEFAULT_H, window.innerHeight - TASKBAR_HEIGHT - 32);

            let currentTypedSpan = null;
            let activeCaret = null;
            let winApi = null;

            const controller = {
                handleInput(value) {
                    if (currentTypedSpan) currentTypedSpan.textContent = value;
                },
                handleEnter(value) {
                    submitCommand(value);
                }
            };

            function typeLine(text, target, done) {
                let i = 0;
                (function step() {
                    if (i <= text.length) {
                        target.textContent = text.slice(0, i);
                        i++;
                        setTimeout(step, 22 + Math.random() * 28);
                    } else {
                        done();
                    }
                })();
            }

            function renderEntry(bodyEl, index) {
                if (index >= introSteps.length) {
                    renderFinalPrompt(bodyEl, true);
                    return;
                }

                const entry = introSteps[index];
                const line = document.createElement('div');
                line.className = 'line';
                line.innerHTML = PROMPT_HTML;
                const cmdSpan = document.createElement('span');
                cmdSpan.className = 'cmd';
                line.appendChild(cmdSpan);
                bodyEl.appendChild(line);

                typeLine(entry.cmd, cmdSpan, () => {
                    const out = document.createElement('div');
                    out.className = 'output';
                    out.innerHTML = entry.output.join('\n');
                    bodyEl.appendChild(out);
                    setTimeout(() => renderEntry(bodyEl, index + 1), 260);
                });
            }

            function renderFinalPrompt(bodyEl, shouldFocus) {
                const line = document.createElement('div');
                line.className = 'line';
                line.innerHTML = PROMPT_HTML;

                const typed = document.createElement('span');
                typed.className = 'cmd';
                const caret = document.createElement('span');
                caret.className = 'caret';

                line.appendChild(typed);
                line.appendChild(caret);
                bodyEl.appendChild(line);

                currentTypedSpan = typed;
                activeCaret = caret;

                if (shouldFocus) {
                    winApi.focus();
                }
            }

            function submitCommand(raw) {
                const bodyEl = winApi.bodyEl;
                if (activeCaret) activeCaret.remove();
                const value = raw.trim();

                if (value.toLowerCase() === 'clear') {
                    bodyEl.innerHTML = '';
                    renderFinalPrompt(bodyEl, false);
                    return;
                }

                if (value.toLowerCase() === 'start') {
                    const out = document.createElement('div');
                    out.className = 'output';
                    out.textContent = 'Iniciando nueva terminal...';
                    bodyEl.appendChild(out);
                    renderFinalPrompt(bodyEl, false);
                    bodyEl.scrollTop = bodyEl.scrollHeight;
                    createTerminalWindow();
                    return;
                }

                if (value !== '') {
                    const match = commands.find((en) => en.cmd.toLowerCase() === value.toLowerCase());
                    const out = document.createElement('div');
                    out.className = 'output';
                    if (match) {
                        out.innerHTML = match.output.join('\n');
                    } else {
                        out.textContent = 'bash: ' + value + ': comando no encontrado';
                    }
                    bodyEl.appendChild(out);
                }

                renderFinalPrompt(bodyEl, false);
                bodyEl.scrollTop = bodyEl.scrollHeight;
            }

            createManagedWindow({
                type: 'terminal',
                title: instanceLabel,
                dockLabel: instanceLabel.replace('guest@ciberdefensa: ~', 'ciberdefensa'),
                width,
                height,
                resizable: true,
                cascade: true,
                onFocus: () => {
                    activeWindow = controller;
                    hiddenInput.value = currentTypedSpan ? currentTypedSpan.textContent : '';
                    hiddenInput.focus();
                },
                onClose: () => {
                    if (activeWindow === controller) activeWindow = null;
                    const idx = terminalControllers.indexOf(controller);
                    if (idx !== -1) terminalControllers.splice(idx, 1);
                    if (WindowManager.countByType('terminal') === 0) createTerminalWindow();
                },
                buildBody: (bodyEl, api) => {
                    winApi = api;
                    terminalControllers.push(controller);
                    renderEntry(bodyEl, 0);
                }
            });
        }

        function createInstagramWindow() {
            createManagedWindow({
                type: 'instagram',
                title: 'guest@ciberdefensa: ~/instagram',
                dockLabel: '📸 Instagram',
                width: Math.min(380, window.innerWidth - 32),
                resizable: false,
                cascade: false,
                modal: true,
                extraBodyClass: 'ig-body',
                buildBody: (bodyEl, api) => {
                    bodyEl.innerHTML =
                        '<p class="ig-title">📸 Seguí a CiberDefensa Team</p>' +
                        '<p>Noticias, memes e info de ciberdefensa.</p>' +
                        '<div class="ig-links" role="group" aria-label="Enlaces de CiberDefensa">' +
                            '<a class="ig-btn primary" href="https://instagram.com/ciberdefensa.team" target="_blank" rel="noopener">' +
                                '<small style="opacity:0.85">Instagram</small>' +
                            '</a>' +
                            '<a class="ig-btn secondary" href="https://wa.me/link" target="_blank" rel="noopener">' +
                                '<span>Grupo de WhatsApp</span>' +
                            '</a>' +
                        '</div>';
                }
            });
        }

        if (window.matchMedia('(pointer: fine)').matches) {
            document.body.classList.add('custom-cursor');
        }

        createTerminalWindow();
        createInstagramWindow();
    </script>
</body>
</html>
