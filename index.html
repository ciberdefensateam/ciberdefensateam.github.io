<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiberDefensa Team</title>
    <style>
        :root {
            --bg: #0a0e14;
            --terminal-bg: #0d1117;
            --border: #222a35;
            --text: #b7c0cc;
            --dim: #5b6472;
            --accent: #5fb87a;
            --accent-2: #7aa2c9;
            --warn: #c9a227;
            --dot-red: #c9575a;
            --dot-yellow: #c9a227;
            --dot-green: #3ea55c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, #131a24 0%, var(--bg) 60%);
            color: var(--text);
            font-family: "Cascadia Code", "Fira Code", ui-monospace, "SFMono-Regular", Consolas, "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 1.5rem;
        }

        body.custom-cursor,
        body.custom-cursor * {
            cursor: none;
        }

        .cursor-block {
            position: fixed;
            top: 0;
            left: 0;
            width: 9px;
            height: 18px;
            background: var(--accent);
            opacity: 0.85;
            mix-blend-mode: screen;
            border-radius: 1px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-2px, -2px);
            animation: blink 1s steps(1) infinite;
            transition: transform 0.05s ease-out;
        }

        .cursor-block.clicking {
            transform: translate(-2px, -2px) scale(0.8);
        }

        @keyframes blink {
            0%, 49% { opacity: 0.85; }
            50%, 100% { opacity: 0.15; }
        }

        .terminal {
            width: 100%;
            max-width: 700px;
            background: var(--terminal-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 0.9rem;
            background: #10151c;
            border-bottom: 1px solid var(--border);
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        .dot.red { background: var(--dot-red); }
        .dot.yellow { background: var(--dot-yellow); }
        .dot.green { background: var(--dot-green); }

        .terminal-title {
            flex: 1;
            text-align: center;
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 0.02em;
        }

        .terminal-body {
            padding: 1.4rem 1.4rem 1.6rem;
            font-size: 0.92rem;
            line-height: 1.65;
            min-height: 340px;
        }

        .line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt {
            color: var(--accent-2);
        }

        .prompt .path {
            color: var(--accent);
        }

        .cmd {
            color: var(--text);
        }

        .output {
            color: var(--dim);
            margin: 0.1rem 0 0.7rem 0;
        }

        .output .highlight {
            color: var(--warn);
        }

        .caret {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: var(--accent);
            vertical-align: text-bottom;
            margin-left: 2px;
            animation: blink 1s steps(1) infinite;
        }

        @media (max-width: 640px) {
            .terminal-body {
                font-size: 0.82rem;
                padding: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="terminal-title">guest@ciberdefensa: ~</span>
        </div>
        <div class="terminal-body" id="terminal-body"></div>
    </div>

    <script>
        const PROMPT_HTML = '<span class="prompt">guest@<span class="path">ciberdefensa</span>:~$</span> ';

        const entries = [
            {
                cmd: 'whoami',
                output: ['ciberdefensa_team']
            },
            {
                cmd: 'cat about.txt',
                output: [
                    'Grupo de estudiantes de la FADENA 🛡️',
                    'Noticias, memes e info de ciberseguridad, todo en un solo lugar.'
                ]
            },
            {
                cmd: 'ls contenido/',
                output: ['noticias_y_novedades/', 'memes/', 'info/']
            },
            {
                cmd: 'cat contenido/noticias_y_novedades/README.md',
                output: ['Lo último del mundo cyber, resumido por el equipo.']
            },
            {
                cmd: 'cat contenido/memes/README.md',
                output: ['Memes para sobrevivir a la facultad (y a los parciales de redes).']
            },
            {
                cmd: 'cat contenido/info/README.md',
                output: ['Recursos, guías y novedades del grupo, todo el tiempo.']
            }
        ];

        const body = document.getElementById('terminal-body');

        function typeLine(text, target, done) {
            let i = 0;
            (function step() {
                if (i <= text.length) {
                    target.textContent = text.slice(0, i);
                    i++;
                    setTimeout(step, 22 + Math.random() * 28);
                } else {
                    done();
                }
            })();
        }

        function renderEntry(index) {
            if (index >= entries.length) {
                renderFinalPrompt();
                return;
            }

            const entry = entries[index];
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = PROMPT_HTML;
            const cmdSpan = document.createElement('span');
            cmdSpan.className = 'cmd';
            line.appendChild(cmdSpan);
            body.appendChild(line);

            typeLine(entry.cmd, cmdSpan, () => {
                const out = document.createElement('div');
                out.className = 'output';
                out.textContent = entry.output.join('\n');
                body.appendChild(out);
                setTimeout(() => renderEntry(index + 1), 260);
            });
        }

        function renderFinalPrompt() {
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = PROMPT_HTML + '<span class="caret"></span>';
            body.appendChild(line);
        }

        renderEntry(0);

        if (window.matchMedia('(pointer: fine)').matches) {
            document.body.classList.add('custom-cursor');
            const cursor = document.createElement('div');
            cursor.className = 'cursor-block';
            document.body.appendChild(cursor);

            window.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
            window.addEventListener('mousedown', () => cursor.classList.add('clicking'));
            window.addEventListener('mouseup', () => cursor.classList.remove('clicking'));
        }
    </script>
</body>
</html>
